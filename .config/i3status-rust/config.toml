icons_format = "<span size='large'>{icon}</span>"

[theme]
theme = "space-villain"

[icons]
icons = "material-nf"

[[block]]
block = "net"
device = "eno1"
format = " ↑$speed_up.eng(w:2) ↓$speed_down.eng(w:2)"
interval = 1

[[block]]
block = "amd_gpu"
format = " $icon $utilization $vram_used.eng(w:3,p:Gi) / $vram_total.eng(w:3,p:Gi)"
interval = 1

[[block]]
block = "temperature"
format = "$icon $average"
chip = "k10temp-pci-00c3"
interval = 1

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
format = " $icon  $utilization1 $utilization2 $utilization3 $utilization4 $utilization5 $utilization6 $utilization7 $utilization8 $utilization9 $utilization10 $utilization11 $utilization12"
interval = 1

[[block]]
block = "memory"
format = " $icon   $mem_used.eng(w:4,p:Mi) / $mem_total.eng(w:4,p:Mi) "
interval = 1

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
warning = 20.0
alert = 10.0
format = "$icon  $available.eng(w:2)"
interval = 20

[[block]]
block = "sound"

[[block]]
block = "time"
format = "$timestamp.datetime(f:'%a %d/%m/%Y %H:%M:%S')"
interval = 1
[block.theme_overrides]
idle_bg = "#4c046e"
idle_fg = "#FFFFFF"
